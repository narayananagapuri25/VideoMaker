name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "production/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload resolved dependency lockfile for one-time repository lock-in
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: generated-npm-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 1
          compression-level: 0
      - name: Review dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); for (const [name, item] of Object.entries(report.vulnerabilities || {})) { console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`); for (const via of item.via || []) if (typeof via === "object") console.log(`  ${via.title} (${via.range})`); } const summary=report.metadata?.vulnerabilities || {}; if ((summary.high || 0) + (summary.critical || 0) > 0) process.exit(1);'
      - name: Run unit tests
        run: npm run test
      - name: Build production app
        run: npm run build
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production/hardening-pass'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download resolved lockfile
        uses: actions/download-artifact@v7
        with:
          name: generated-npm-lock-${{ github.sha }}
          path: generated-lock
      - name: Commit lockfile for reproducible installs
        run: |
          if test -f package-lock.json; then
            echo 'A lockfile is already committed.'
            exit 0
          fi
          cp generated-lock/package-lock.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Add npm lockfile for reproducible installs'
          git push origin HEAD:production/hardening-pass
